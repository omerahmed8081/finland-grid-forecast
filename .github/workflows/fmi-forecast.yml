name: Archive FMI next-day forecast

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: python -m gridcast.ingest.forecast_job
      - uses: actions/upload-artifact@v4
        with:
          name: fmi-forecast-snapshot-${{ github.run_id }}
          path: data/gridcast.duckdb
          retention-days: 90
