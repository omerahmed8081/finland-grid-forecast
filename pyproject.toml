[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finland-grid-forecast"
version = "0.1.0"
description = "Hourly electricity consumption forecasting for Finland"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.8,<2",
    "duckdb>=1.1,<2",
    "holidays>=0.50",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4", "pytest>=8", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
